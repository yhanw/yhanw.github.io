  <main id="main">
    <div class="container">
      <div class="page-hero" style="padding-bottom:24px">
        <span class="eyebrow">✦ Admin · 管理后台</span>
        <h1 class="page-title" style="font-size:clamp(2rem,5vw,2.8rem)">博客 <span class="grad font-latin">ADMIN</span></h1>
        <p class="page-sub">文章通过 GitHub API 提交到仓库，推送后自动发布。</p>
      </div>

      <div class="admin-wrap">
        <!-- ============ 登录 ============ -->
        <section class="admin-card" id="view-login">
          <h2>连接 GitHub</h2>
          <p class="sub">输入你的仓库与个人访问令牌（PAT），即可开始管理文章。</p>
          <div class="admin-error" id="login-error"></div>
          <div class="field">
            <label for="f-repo">仓库 <span class="hint">owner/repo</span></label>
            <input class="input" id="f-repo" placeholder="yhanw/yhanw.github.io" autocomplete="off">
          </div>
          <div class="field">
            <label for="f-token">GitHub 个人访问令牌（PAT）</label>
            <input class="input" id="f-token" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
          </div>
          <div class="admin-actions">
            <button class="btn btn-primary" id="btn-connect">🔗 连接</button>
          </div>
          <div class="token-note">
            🔒 Token 只保存在<strong>你自己的浏览器</strong>（localStorage）中，不会上传到任何服务器。
            建议使用仅授权本仓库的 fine-grained token（Contents 读写权限）。
          </div>
        </section>

        <!-- ============ 文章列表 ============ -->
        <section class="admin-card" id="view-main" style="display:none">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
            <div>
              <h2>文章管理</h2>
              <p class="sub" id="repo-label" style="margin-bottom:0"></p>
            </div>
            <div class="admin-actions" style="margin-top:0">
              <button class="btn btn-primary" id="btn-new">✍️ 写新文章</button>
              <button class="btn btn-ghost" id="btn-logout">退出</button>
            </div>
          </div>
          <div class="admin-error" id="main-error"></div>
          <div class="admin-list" id="post-list">
            <div class="admin-loading">加载中…</div>
          </div>
        </section>

        <!-- ============ 编辑器 ============ -->
        <section class="admin-card" id="view-editor" style="display:none">
          <h2 id="editor-title">写新文章</h2>
          <p class="sub">正文支持 Markdown：标题、列表、引用、代码块、链接、图片等。</p>
          <div class="admin-error" id="edit-error"></div>
          <input type="hidden" id="f-orig-id">

          <div class="field-row">
            <div class="field">
              <label for="f-id">文章 ID（slug）<span class="hint">小写字母/数字/连字符</span></label>
              <input class="input" id="f-id" placeholder="my-first-post" autocomplete="off">
            </div>
            <div class="field">
              <label for="f-category">分类</label>
              <input class="input" id="f-category" placeholder="随笔 / 折腾 / 音游" autocomplete="off">
            </div>
          </div>

          <div class="field">
            <label for="f-title">标题</label>
            <input class="input" id="f-title" placeholder="文章的标题" autocomplete="off">
          </div>

          <div class="field-row">
            <div class="field">
              <label for="f-date">日期</label>
              <input class="input" id="f-date" type="date">
            </div>
            <div class="field">
              <label for="f-tags">标签 <span class="hint">用逗号分隔</span></label>
              <input class="input" id="f-tags" placeholder="博客, 日常" autocomplete="off">
            </div>
          </div>

          <div class="field">
            <label for="f-summary">摘要</label>
            <textarea class="textarea" id="f-summary" placeholder="列表页展示的一句话简介"></textarea>
          </div>

          <div class="field">
            <label for="f-body">正文（Markdown）</label>
            <textarea class="textarea textarea-lg" id="f-body" placeholder="# 标题&#10;&#10;正文内容…"></textarea>
          </div>

          <label class="check-row" style="margin-bottom:6px">
            <input type="checkbox" id="f-draft">
            存为草稿（不在博客页面展示）
          </label>

          <div class="editor-preview" id="preview"></div>

          <div class="admin-actions">
            <button class="btn btn-primary" id="btn-save">💾 保存并发布</button>
            <button class="btn btn-ghost" id="btn-preview">👁️ 预览</button>
            <button class="btn btn-ghost" id="btn-back">← 返回列表</button>
          </div>
        </section>
      </div>
    </div>
