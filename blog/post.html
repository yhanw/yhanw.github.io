      <!-- 评论区（giscus） -->

        <h2 id="giscus-title" class="giscus-title">评论</h2>
        <div id="giscus-box">
          <p class="giscus-note">评论功能待配置：推送到 GitHub 并开启仓库 Discussions 后，在 blog/post.html 中填入 repoId 与 categoryId。</p>
        </div>
      </section>
      <script>
        var GISCUS = {
          repo: 'yhanw/yhanw.github.io',
          repoId: '',      /* ✏️ 填入仓库 ID（开启 Discussions 后获取） */
          category: 'Announcements',
          categoryId: '',  /* ✏️ 填入分类 ID */
          mapping: 'pathname'
        };
        if (GISCUS.repoId && GISCUS.categoryId) {
          var giscusBox = document.getElementById('giscus-box');
          giscusBox.innerHTML = '';
          var s = document.createElement('script');
          s.src = 'https://giscus.app/client.js';
          s.setAttribute('data-repo', GISCUS.repo);
          s.setAttribute('data-repo-id', GISCUS.repoId);
          s.setAttribute('data-category', GISCUS.category);
          s.setAttribute('data-category-id', GISCUS.categoryId);
          s.setAttribute('data-mapping', GISCUS.mapping);
          s.setAttribute('data-strict', '0');
          s.setAttribute('data-reactions-enabled', '1');
          s.setAttribute('data-emit-metadata', '0');
          s.setAttribute('data-input-position', 'bottom');
          s.setAttribute('data-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
          s.setAttribute('data-lang', 'zh-CN');
          s.setAttribute('crossorigin', 'anonymous');
          s.async = true;
          giscusBox.appendChild(s);
        }
      </script>
